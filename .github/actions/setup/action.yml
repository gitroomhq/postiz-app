name: Setup Node and pnpm
description: Node from .nvmrc, pnpm from packageManager, cached store, installed dependencies

runs:
  using: composite
  steps:
    # Must come before setup-node, whose `cache: pnpm` needs pnpm on PATH.
    # No `version:` input: pnpm reads it from packageManager in package.json.
    - uses: pnpm/action-setup@v4
      with:
        run_install: false

    # `cache: pnpm` already caches the pnpm store keyed on the lockfile, so no
    # manual actions/cache step is needed.
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
