name: Publish GHCR image

on:
  push:
    branches:
      - webhook-media-and-settings
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push overlay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.overlay
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ioroot/postiz-app:latest
            ghcr.io/ioroot/postiz-app:webhook
          labels: |
            org.opencontainers.image.source=https://github.com/IORoot/postiz-app
            org.opencontainers.image.description=Postiz with webhook media and settings
