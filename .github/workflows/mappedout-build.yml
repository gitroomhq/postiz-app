name: "Build Mapped Out Image"

# Builds the customized (Mapped Out branded) Postiz image and publishes it to
# this fork's GitHub Container Registry. Runs on GitHub's runners (no load on
# the production server). Trigger manually (Actions tab -> Run workflow) or on
# push to the branding branch.
on:
  workflow_dispatch:
  push:
    branches:
      - mappedout-branding

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64)
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t ghcr.io/${{ github.repository_owner }}/postiz-app:mappedout \
            --build-arg NEXT_PUBLIC_VERSION=mappedout \
            --push \
            --provenance=false --sbom=false \
            .
