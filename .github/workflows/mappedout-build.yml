name: "Build Mapped Out Image"

# Builds the customized (Mapped Out branded) Postiz image and publishes it to
# this fork's GitHub Container Registry. Runs on GitHub's runners (no load on
# the production server). Trigger manually (Actions tab -> Run workflow) or on
# push to the branding branch.
on:
  workflow_dispatch:
  push:
    branches:
      - mappedout-branding
      - phase2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Production tag (:mappedout) is ONLY published from the mappedout-branding
      # branch. Every other branch (e.g. phase2) publishes under its own branch
      # name as the tag, so untested work never overwrites the live image.
      - name: Compute image tag
        id: meta
        run: |
          if [ "${{ github.ref_name }}" = "mappedout-branding" ]; then
            echo "tag=mappedout" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (amd64)
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t ghcr.io/${{ github.repository_owner }}/postiz-app:${{ steps.meta.outputs.tag }} \
            --build-arg NEXT_PUBLIC_VERSION=${{ steps.meta.outputs.tag }} \
            --push \
            --provenance=false --sbom=false \
            .
