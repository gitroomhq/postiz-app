---
name: ESLint

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - apps/**
      - '!apps/docs/**'
      - libraries/**

  pull_request:
    paths:
      - package.json
      - apps/**
      - '!apps/docs/**'
      - libraries/**

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm has to exist before setup-node can look up its cache
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint (backend, orchestrator, libraries)
        run: pnpm run lint

      # The Next.js config in apps/frontend enables rules that the rest of the
      # repo keeps off (no-unused-vars, no-explicit-any, ...), so it still has a
      # pre-existing backlog and cannot block a PR yet. It is run here so the
      # backlog is visible and shrinks instead of growing unnoticed.
      - name: Run ESLint (frontend, report only)
        run: pnpm run lint:frontend
        continue-on-error: true
