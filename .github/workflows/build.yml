---
name: Build

on:
  push:
  merge_group:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node comes from .nvmrc, pnpm is pinned to the packageManager version,
      # and the store cache is keyed on the lockfile alone. The previous inline
      # cache block was commented out, and its key also hashed every source
      # file, so it could never have produced a hit.
      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm run build
