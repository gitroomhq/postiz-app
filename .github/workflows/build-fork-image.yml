name: "Build fork image"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, for example 2.25.3-mix1"
        required: true
      ref:
        description: "Branch or tag to build"
        required: true
        default: "feat/instagram-reel-audio-preview"

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        env:
          TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/postiz-app:${TAG}"
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t "$IMAGE" \
            --build-arg NEXT_PUBLIC_VERSION="${TAG}" \
            --provenance=false --sbom=false \
            --output "type=registry,name=${IMAGE}" .
